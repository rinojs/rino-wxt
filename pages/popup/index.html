<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rino Extension</title>
    <link rel="stylesheet" href="/styles/popup/index.css" />
    <script src="/scripts/popup/index.js" defer></script>
  </head>
  <body>
    <main class="popup-shell">
      <header class="topbar">
        <div class="brand-mark" aria-hidden="true">R</div>
        <div class="brand-copy">
          <strong>Rino</strong>
          <span>Browser companion</span>
        </div>
        <span class="version">v0.1</span>
      </header>

      <section class="hero">
        <span class="eyebrow">Extension status</span>
        <div class="status-heading">
          <span class="status-dot" aria-hidden="true"></span>
          <h1>Ready to go</h1>
        </div>
        <p>Your Rino.js extension is installed and running correctly.</p>
      </section>

      <section class="summary" aria-label="Extension summary">
        <div>
          <span class="summary-label">Protection</span>
          <strong>Active</strong>
        </div>
        <div>
          <span class="summary-label">This session</span>
          <strong>12 checks</strong>
        </div>
      </section>

      <button id="check-script" class="primary-action" type="button">
        <span>Run a quick check</span>
        <span aria-hidden="true">→</span>
      </button>
      <button id="restore-panels" class="secondary-action" type="button">
        Restore inserted panels
      </button>
      <p id="script-status" class="script-status" role="status" aria-live="polite">
        JavaScript is waiting.
      </p>

      <footer>
        <span>Built with Rino.js</span>
        <a href="https://rinojs.com/" target="_blank" rel="noreferrer">Learn more</a>
      </footer>
    </main>
  </body>
</html>
