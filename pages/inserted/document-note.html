<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Document note</title>
    <link rel="stylesheet" href="/styles/inserted/index.css" />
    <script src="/scripts/inserted/index.js" defer></script>
  </head>
  <body>
    <main>
      <span class="eyebrow">Document positioned</span>
      <h1>I scroll with the page</h1>
      <p class="lead">This panel uses <code>fixed: false</code>, so it belongs to the document instead of staying attached to the browser viewport.</p>
      <section class="card-grid">
        <article class="metric"><span>Position</span><strong>Top left</strong></article>
        <article class="metric"><span>Behavior</span><strong>Scrollable</strong></article>
      </section>
    </main>
  </body>
</html>
